services:
  user-database:
    container_name: user-service-database
    image: postgres:18
    environment:
      POSTGRES_DB: dev_user_database
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: 12345678
    ports:
      - "5431:5432"
    volumes:
      - "user_data:/var/lib/postgresql"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U developer -d dev_database" ]
      interval: 5s
      timeout: 15s
      retries: 5

volumes:
  user_data:
